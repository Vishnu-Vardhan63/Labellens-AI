services:
  - type: web
    name: labellens-ai
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://labellens-ai-theta.vercel.app,http://localhost:5173
      # DATABASE_URL and UPLOAD_DIR must be set manually in Render dashboard env vars
      # DATABASE_URL=postgresql://... (Neon connection string — do NOT commit credentials)
      # UPLOAD_DIR=/tmp/uploads
