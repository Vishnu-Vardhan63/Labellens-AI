services:
  - type: web
    name: labellens-ai
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://labellens-ai-theta.vercel.app,http://localhost:5173
      - key: UPLOAD_DIR
        value: ./uploads
      - key: DATABASE_URL
        value: sqlite:///./label_lens.db
